# Dayton, OH — data sources. Every URL below was checked live on 2026-10-02
# (fields + counts in app/data_import/dayton/field_maps.py). Importers fall back to the
# field_maps.py URLs when a `url` is missing, so this file and field_maps must agree.
city:
  name: Dayton
  slug: dayton
  state: OH
  center: [-84.1916, 39.7589]
  default_zoom: 12
  # Profile bounds (west,south),(east,north). Same as frontend DAYTON_PROFILE.bounds and
  # dayton/_sources.DAYTON_BBOX — keep the three in sync.
  bounds: [[-84.35, 39.65], [-84.05, 39.85]]

sources:
  buildings:
    # City of Dayton footprints, county-wide (338,321); envelope-filtered to the bbox (230,328).
    # No address field — address/owner/year come from the parcel join (dayton/enrich.py).
    url: "https://maps.daytonohio.gov/gisservices/rest/services/Viewer/MapLayers_Citywide/MapServer/307"
    fallback_url: "https://minedbuildings.z5.web.core.windows.net/legacy/usbuildings-v2/Ohio.geojson.zip"
    note: "fallback not wired; Microsoft Ohio file is ~5M features and must be clipped first"

  zoning:
    # 970 polygons. Current code = NEW_ZONE (DISTRICT is the pre-2006 code).
    url: "https://maps.daytonohio.gov/gisservices/rest/services/Viewer/MapLayers_Citywide/MapServer/203"

  parcels:
    # Parcel polygons ⋈ Montgomery County (OH) Auditor CAMA — owner, address, appraisal.
    # 273,627 county-wide. Spatial queries are refused, so the importer pages the county.
    url: "https://maps.daytonohio.gov/gisservices/rest/services/Viewer/MapLayers_Citywide/MapServer/9"
    # TRAP: services6.arcgis.com/EbVsqZ18sv1kVJ3k/.../Montgomery_County_Parcels is
    # Montgomery County, NEW YORK. Never use it for Dayton.

  transit_lines:
    # Greater Dayton RTA single GTFS feed (bus + electric trolleybus). The `*_gtfs_url` key
    # sends import_transit down its GTFS path; the prefix becomes system "GDRTA".
    gdrta_gtfs_url: "http://proc.greaterdaytonrta.org/gtfs/google_transit.zip"

  transit_stations:
    gdrta_gtfs_url: "http://proc.greaterdaytonrta.org/gtfs/google_transit.zip"

  waterways:
    # USGS NHD large-scale flowlines; 560 in the bbox (174 named). Paged + envelope in
    # DaytonWaterwaysImporter.
    url: "https://hydro.nationalmap.gov/arcgis/rest/services/nhd/MapServer/6"

  parks:
    # OSM leisure=park|nature_reserve|garden (no public Five Rivers MetroParks GIS layer found).
    osm_overpass_bbox: "39.65,-84.35,39.85,-84.05"

  railroads:
    osm_overpass_bbox: "39.65,-84.35,39.85,-84.05"

  pois:
    osm_overpass_bbox: "39.65,-84.35,39.85,-84.05"

  police_precincts:
    # Dayton PD areas: 4 (Central, East, West, airport). Already EPSG:4326.
    url: "https://maps.daytonohio.gov/gisservices/rest/services/Police/PoliceAreas/MapServer/0"

  neighborhoods:
    # 97 features; the 31 "… - OUTSIDE CITY" fillers are dropped → 66.
    url: "https://maps.daytonohio.gov/gisservices/rest/services/Viewer/MapLayers_Citywide/MapServer/310"

  zip_codes:
    # 2020 ZCTAs, prefix 453/454, kept only where they overlap the city outline.
    url: "https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/PUMA_TAD_TAZ_UGA_ZCTA/MapServer/1"

  major_streets:
    # Centerlines filtered to FHWA functional class 11/12/14/16 (interstate → minor arterial).
    url: "https://maps.daytonohio.gov/gisservices/rest/services/Viewer/MapLayers_Citywide/MapServer/312"

  streets:
    note: "replaced by major_streets (DaytonMajorStreetsImporter); basemap draws the rest"
