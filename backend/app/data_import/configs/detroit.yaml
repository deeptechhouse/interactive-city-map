city:
  name: Detroit
  slug: detroit
  state: MI
  center: [-83.0458, 42.3314]
  default_zoom: 11
  bounds: [[-83.30, 42.20], [-82.90, 42.50]]

sources:
  # =========================================================================
  # BUILDING FOOTPRINTS — from SEMCOG (Southeast Michigan Council of Governments)
  # NOT on data.detroitmi.gov. Uses ArcGIS FeatureServer with EPSG:2898
  # (Michigan South State Plane, feet). Requires arcgis_helper.py for
  # paginated download + coordinate reprojection to WGS84.
  # =========================================================================
  buildings:
    arcgis_featureserver: true
    url: "https://gis.semcog.org/server/rest/services/Hosted/Building_Footprints__2020/FeatureServer/60/query"
    source_srid: 2898
    page_size: 2000
    output_format: "json"
    # ADJUSTABLE: server-side city clip. SEMCOG codes Detroit as planning sub-areas
    # city_id 501–555 (244,010 footprints; 240,697 standing — checked 2026-10-02).
    # Widen only on purpose: the layer covers all of SE Michigan (1.67M rows).
    where: "city_id BETWEEN 501 AND 555 AND demolished IS NULL"
    note: "SEMCOG building footprints 2020 — layer ID 60 (not 0). Region-wide; filtered to Detroit by `where`. Server only supports f=json; arcgis_helper converts. Fields verified 2026-10-02: gid, address, ref_name, year_built, stories, apn (lower case)."

  # =========================================================================
  # DETROIT OPEN DATA PORTAL — ArcGIS Hub (data.detroitmi.gov)
  # Org ID: qvkbeam7Wirps6zC
  # All datasets below use ArcGIS REST FeatureServer query endpoints.
  # Append /query?where=1=1&outFields=*&f=geojson to get GeoJSON.
  # =========================================================================
  zoning:
    arcgis_featureserver: true
    url: "https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/Zoning_1/FeatureServer/0/query"
    note: "Detroit zoning districts from City Planning Commission"

  parcels:
    arcgis_featureserver: true
    url: "https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/parcel_file_current/FeatureServer/0/query"
    note: "Office of the Assessor — 377,940 rows (2026-10-02), maxRecordCount 1000. Static build pulls parcel_id + taxpayer_1 only (no geometry) to put owner_name on buildings."

  police_precincts:
    arcgis_featureserver: true
    url: "https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/DPD_Precincts_Reid2/FeatureServer/0/query"
    note: "DPD police precinct boundaries — 12 precincts"

  council_districts:
    arcgis_featureserver: true
    url: "https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/city_council_districts_2026/FeatureServer/0/query"
    note: "City council district boundaries — 7 single-member districts, effective Jan 1, 2026"

  neighborhoods:
    arcgis_featureserver: true
    url: "https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/Current_City_of_Detroit_Neighborhoods/FeatureServer/0/query"
    note: "205 neighborhood boundaries from Dept. of Neighborhoods"

  business_licenses:
    arcgis_featureserver: true
    url: "https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/bseed_active_business_licenses/FeatureServer/0/query"
    note: "Active business licenses issued by BSEED"

  zip_codes:
    arcgis_featureserver: true
    url: "https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/City_of_Detroit_Zip_Code_List/FeatureServer/0/query"
    note: "Checked 2026-10-02: a non-spatial TABLE (ZIP_CODE, 39 mailing ZIPs incl. suburbs). Polygons come from polygon_url (TIGERweb ZCTAs), kept where >=1% lies in the city (detroit/import_boundaries.py)."
    # Base query URL; the importer adds the bbox envelope with inSR=4326 (without it the
    # envelope is read as Web Mercator).
    polygon_url: "https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_ACS2023/MapServer/2/query"
    bbox: [[-83.30, 42.20], [-82.90, 42.50]]
    fallback_url: "https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_ACS2023/MapServer/2/query?where=1%3D1&geometry=-83.30%2C42.20%2C-82.90%2C42.50&geometryType=esriGeometryEnvelope&outFields=*&f=geojson"

  dlba_properties:
    arcgis_featureserver: true
    url: "https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/DLBA_Owned_Properties/FeatureServer/0/query"
    note: "Detroit Land Bank Authority owned properties — see also buildingdetroit.org for auction listings"

  # Read by import_blight.py. Cities without this block import no blight (fail closed);
  # until 2026-10-02 these URLs were hard-coded and leaked into every city's import.
  blight_violations:
    tickets_url: "https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/blight_tickets/FeatureServer/0/query"
    demolitions_url: "https://services2.arcgis.com/qvkbeam7Wirps6zC/arcgis/rest/services/Commercial_Demolitions/FeatureServer/0/query"
    # ADJUSTABLE: server-side filter on tickets. Default = every ticket with coordinates
    # (902,995 of 906,848 on 2026-10-02, 2005 → today; ~900 requests of 1,000 rows).
    # To shrink the layer to recent years use e.g.
    #   "latitude IS NOT NULL AND ticket_issued_date >= DATE '2021-01-01'"   (411,525 rows)
    # TRAP: write DATE '…'. A bare '2021-01-01' works for counts but the paged query
    # fails with "ArcGIS error 400: Unable to perform query" (checked 2026-10-02).
    # STATIC BUILD CHOICE (2026-10-02): tickets issued since 2021 only (411,525 rows). The
    # full 903K-row history is too heavy for a hand-tested static map.
    tickets_where: "latitude IS NOT NULL AND ticket_issued_date >= DATE '2021-01-01'"
    page_size: 1000          # server maxRecordCount for blight_tickets
    bbox: [[-83.30, 42.20], [-82.90, 42.50]]   # same as city.bounds; drops 0,0 / stray points
    note: "Tickets carry location in latitude/longitude, not geometry. Commercial_Demolitions is marked Deprecated upstream."

  # =========================================================================
  # TRANSIT — GTFS ZIP files from 4 agencies
  # All systems are active as of 2026. Free to ride: QLine (through 2039),
  # People Mover (no fare since Jan 2024).
  # =========================================================================
  transit_lines:
    ddot_gtfs_url: "https://www.detroitmi.gov/Portals/0/docs/deptoftransportation/pdfs/ddot_gtfs.zip"
    smart_gtfs_url: "https://apps1.smartbus.org/gtfs/smart_gtfs.zip"
    qline_gtfs_url: "https://data.trilliumtransit.com/gtfs/qline-mi-us/qline-mi-us.zip"
    people_mover_gtfs_url: "https://hosted-gtfs-feeds.s3.amazonaws.com/DPM/gtfs.zip"
    note: "4 transit agencies: DDOT (city bus), SMART (suburban bus), QLine (streetcar on Woodward Ave, 12 stations), People Mover (elevated rail loop, 13 stations)"

  transit_stations:
    ddot_gtfs_url: "https://www.detroitmi.gov/Portals/0/docs/deptoftransportation/pdfs/ddot_gtfs.zip"
    smart_gtfs_url: "https://apps1.smartbus.org/gtfs/smart_gtfs.zip"
    qline_gtfs_url: "https://data.trilliumtransit.com/gtfs/qline-mi-us/qline-mi-us.zip"
    people_mover_gtfs_url: "https://hosted-gtfs-feeds.s3.amazonaws.com/DPM/gtfs.zip"
    note: "Stops extracted from stops.txt in each GTFS zip"

  # =========================================================================
  # OSM / OVERPASS — bbox covers Detroit city limits
  # south=42.20, west=-83.30, north=42.50, east=-82.90
  # =========================================================================
  railroads:
    osm_overpass_bbox: "42.20,-83.30,42.50,-82.90"
    note: "Railroad segments from OSM — includes active, abandoned, and disused lines"

  pois:
    osm_overpass_bbox: "42.20,-83.30,42.50,-82.90"
    note: "Points of interest from OSM — churches, theaters, museums, venues, gyms, galleries, etc."

  # =========================================================================
  # WATERWAYS — USGS National Hydrography Dataset
  # Detroit River, Rouge River, River Rouge, canals
  # =========================================================================
  waterways:
    url: "https://hydro.nationalmap.gov/arcgis/rest/services/nhd/MapServer/6/query?where=1%3D1&geometry=-83.30%2C42.20%2C-82.90%2C42.50&geometryType=esriGeometryEnvelope&inSR=4326&outSR=4326&spatialRel=esriSpatialRelIntersects&outFields=GNIS_NAME,FTYPE,FCODE&f=geojson&resultRecordCount=5000"
    note: "NHD flowlines clipped to Detroit bbox — Detroit River, Rouge River. Requires inSR/outSR/spatialRel params."

  # =========================================================================
  # PARKS — from Data Driven Detroit (D3) portal
  # =========================================================================
  parks:
    url: "https://services2.arcgis.com/HsXtOCMp1Nis1Ogr/arcgis/rest/services/Parks_Landmarks/FeatureServer/0/query"
    arcgis_featureserver: true
    note: "Municipal parks, landmarks, golf courses, City Airport, civic plazas from Data Driven Detroit (D3). Org ID: HsXtOCMp1Nis1Ogr"

  # =========================================================================
  # STREETS — major labeled streets come from static data, not import
  # =========================================================================
  # Read by detroit/import_major_streets.py (OSM Overpass; labels curated in that file).
  major_streets:
    osm_overpass_bbox: "42.20,-83.30,42.50,-82.90"
    note: "Named arterials + freeways, merged per label and clipped to the city (council-district union)."

  streets:
    note: "Streets come from basemap tiles; Detroit's radial spoke avenues (Woodward, Michigan, Grand River, Gratiot, Jefferson, Fort) added as static major_streets data"

# =========================================================================
# INTERIOR MAPS — configured in separate detroit_interior.yaml
# =========================================================================
interior:
  enabled: true
  osm:
    enabled: true
    overpass_bbox: [42.20, -83.30, 42.50, -82.90]
  county:
    name: "Wayne County"
    assessor_api: ""
  sanborn:
    enabled: true
    loc_query: "sanborn detroit michigan"
    note: "81 Sanborn map items at Library of Congress (1884-1950s), all public domain"
  venue_scraping:
    enabled: true
    categories: ["church", "hotel_event", "theater", "museum", "community_center", "gymnasium", "music_venue", "gallery"]
